name: Provision AWS infrastructure

on:
  workflow_dispatch:
    inputs:
      bucket_name:
        description: "Globally unique name for the wedding website S3 bucket"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: wedding-infrastructure
  cancel-in-progress: false

jobs:
  provision:
    name: Provision S3 and CloudFront
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1
      TF_STATE_BUCKET: deployment-tf-state-bucket
      TF_VAR_bucket_name: ${{ inputs.bucket_name }}
      TF_VAR_aws_region: ap-south-1
      TF_IN_AUTOMATION: true

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate configuration
        shell: bash
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          test -n "$ROLE_ARN" || (echo "Missing repository variable AWS_ROLE_ARN" && exit 1)
          test -n "$TF_STATE_BUCKET" || (echo "Terraform state bucket is required" && exit 1)
          test -n "$TF_VAR_bucket_name" || (echo "Website bucket name is required" && exit 1)

      - name: Debug OIDC claims
        shell: bash
        run: |
          python - <<'PY'
          import os, json, base64, urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in url else "?"
          url += separator + "audience=sts.amazonaws.com"

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer " +
                  os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              }
          )

          token = json.load(urllib.request.urlopen(request))["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in ("iss", "aud", "sub"):
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Terraform format and validate
        working-directory: infra/terraform
        run: |
          terraform fmt -recursive
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=wedding-invitation/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform validate

      - name: Apply infrastructure
        working-directory: infra/terraform
        run: terraform apply -auto-approve -input=false

      - name: Show deployment configuration
        working-directory: infra/terraform
        run: |
          {
            echo "## AWS infrastructure provisioned"
            echo
            echo "| GitHub Actions repository variable | Terraform output |"
            echo "|---|---|"
            echo "| `AWS_ROLE_ARN` | Existing role: `arn:aws:iam::669930664580:role/Github-Deployment-Role` |"
            echo "| `AWS_REGION` | `$(terraform output -raw aws_region)` |"
            echo "| `AWS_S3_BUCKET` | `$(terraform output -raw s3_bucket_name)` |"
            echo "| `AWS_CLOUDFRONT_DISTRIBUTION_ID` | `$(terraform output -raw cloudfront_distribution_id)` |"
            echo
            echo "**Website URL:** $(terraform output -raw cloudfront_domain_name)"
            echo
            echo "The existing GitHub OIDC provider and Github-Deployment-Role are managed manually and are not created by Terraform."
            echo "Add or update the four values under GitHub → Settings → Secrets and variables → Actions → Variables."
          } >> "$GITHUB_STEP_SUMMARY"
